schema_version: 1
kind: run
profile: paper
name: paper_main
method: atp_rl
entrypoint: pbt
artifacts_root: artifacts
replication:
  training_seeds: [3, 6, 8, 9, 42]
  evaluation_seeds_per_model: 500
physics:
  temporal_correlation: jakes
  decision_interval_s: 0.04
  micro_steps: 20
  residual_doppler_hz: 50.0
boolean_optional_args:
  - p2_include_mrt_features
  - p2_phase_compact_include_mrt_features
args:
  exp_name: paper_main_l3
  runs_root: .
  p1_device: cpu
  p2_device: cpu
  seed: 42
  n_workers: 4
  warmup_model_dir: null
  warmup_ckpt: best
  warmup_ckpt_strict: true
  warmup_tag: l3
  enable_tb: false
  use_worker_init_profiles: true
  worker_lr_mults: 1.0,0.7,1.3,0.3
  worker_ent_mults: 1.0,0.8,1.3,1.0
  adapt_mode: P2
  adapt_episodes: 2464
  ready_every_episodes: 224
  cooldown_episodes: 448
  p12_flip_prob: 0.33
  p21_flip_prob: 0.25
  max_pbt_episodes: 15552
  patience_ready: 0
  chunk_len: 16
  eval_every_episodes: 32
  k_daily: 3
  k_ready: 15
  eval_seed_base: 10001
  eval_seed_stride: 37
  num_exploit: 1
  p1_num_ground_stations: 4
  p1_num_gs_per_rb: 2
  p1_topology_profile: paper_n4
  p2_num_ground_stations: 4
  p2_num_gs_per_rb: 2
  p2_topology_profile: paper_n4
  p1_scheduler_mode: dqn
  p2_scheduler_mode: dqn
  p1_power_mode: ppo
  p2_power_mode: ppo
  p1_fairness_lambda: 3.0
  p2_fairness_lambda: 3.0
  p1_fairness_beta: 0.05
  p2_fairness_beta: 0.05
  p1_csi_error_variance: 0.01
  p2_csi_error_variance: 0.01
  p1_ris_reflection_power_limit_dBm: -5.0
  p2_ris_reflection_power_limit_dBm: -5.0
  p1_active_ris_noise_power_dBm: -100.0
  p2_active_ris_noise_power_dBm: -100.0
  p2_uav_rx_antenna_gain_dBi: 15.0
  p2_ris_elem_max_amp_gain_dB: 40.0
  p1_sic_detection_threshold_dBm: -94.0
  p2_sic_detection_threshold_dBm: -94.0
  p1_lr_dqn: 0.0005
  p2_lr_dqn: 0.0005
  p1_lr_power_ppo: 0.0003
  p2_lr_power_ppo: 0.0003
  p1_ppo_power_buffer_size: 1024
  p2_ppo_power_buffer_size: 1024
  p1_entropy_coef_power: 0.012
  p2_entropy_coef_power: 0.012
  p2_lr_phase_ppo: 0.00006
  p2_ppo_phase_buffer_size: 1024
  p2_entropy_coef_phase: 0.006
  p1_gamma: 0.9
  p2_gamma: 0.9
  p2_include_mrt_features: true
  p2_phase_state_mode: compact_selected
  p2_phase_compact_include_mrt_features: true
  p2_phase_policy_dist: gaussian_latent
  p1_phase_model_include_mrt_features: true
  p1_phase_model_state_mode: compact_selected
  p1_phase_model_compact_include_mrt_features: true
  p1_phase_model_policy_dist: gaussian_latent
  p2_learn_amp_weights: "false"
  ris_num_elem_x: 16
  ris_num_elem_y: 16
  p1_cycle_dqn_before_power: 6
  p1_cycle_power: 1
  p1_ppo_power_opt_episodes: 10
  p1_dqn_batch_size: 128
  p1_dqn_update_freq: 4
  p1_target_update_freq: 8
  p1_gae_lambda: 0.95
  p2_gae_lambda: 0.95
  p1_ppo_power_epochs: 12
  p2_ppo_power_epochs: 12
  p2_ppo_phase_opt_episodes: 16
  p2_ppo_phase_epochs: 6
